name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: flowhouse
          CLICKHOUSE_USER: flowhouse
          CLICKHOUSE_PASSWORD: flowhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: flowhouse
      CLICKHOUSE_PASSWORD: flowhouse
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 17 (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.12.txt"

      - name: Lint with ruff
        run: ruff check .

      - name: Initialize Airflow metadata DB
        run: airflow db migrate

      - name: Run tests
        run: pytest -v

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pip install -r requirements.txt

      - name: Lint dashboard with ruff
        working-directory: dashboard
        run: ruff check .

      - name: Run dashboard tests
        working-directory: dashboard
        run: pytest -v

  publish-dashboard:
    needs: [test, test-dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write   # GITHUB_TOKEN has no registry-write access by default
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            ghcr.io/lilacrapture/flowhouse-dashboard:sha-${{ github.sha }}
            ghcr.io/lilacrapture/flowhouse-dashboard:latest